<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | SBmart</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top">SBmart • Create your customer account</div><main class="authPage"><a class="brand" href="index.html"><i>SB</i>mart</a><div class="authCard"><span class="eyebrow">CREATE ACCOUNT</span><h1>Account banao</h1><p class="muted">Create an account first. Login is required before checkout.</p>
<form onsubmit="registerUser(event)"><input id="name" required placeholder="Full name"><input id="email" required type="email" placeholder="Email address"><input id="password" required type="password" minlength="6" placeholder="Password (minimum 6 characters)"><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Mobile number (optional)"><textarea id="address" placeholder="Delivery address (optional)"></textarea><button class="primary wide">Create Account</button></form><p id="msg" class="authMsg"></p><p class="authSwitch">Already have an account? <a href="login.html">Login</a></p></div></main>
<script>
async function registerUser(e){e.preventDefault();msg.textContent='Creating account...';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value.trim(),email:email.value.trim(),password:password.value,mobile:mobile.value.trim(),address:address.value.trim()})});const x=await r.json();if(!r.ok)throw Error(x.error);location.href='index.html'}catch(err){msg.textContent=err.message}}
</script></body></html>
