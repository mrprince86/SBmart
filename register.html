<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | SBmart</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top">SBmart • Create your customer account</div><main class="authPage"><a class="brand" href="index.html"><i>SB</i>mart</a><div class="authCard"><span class="eyebrow">CREATE ACCOUNT</span><h1>Account banao</h1><p class="muted">Create an account first. Login is required before checkout.</p>
<form onsubmit="registerUser(event)"><input id="name" required placeholder="Full name"><input id="email" required type="email" placeholder="Email address"><input id="password" required type="password" minlength="6" placeholder="Password (minimum 6 characters)"><button class="primary wide">Create Account</button></form><p id="msg" class="authMsg"></p><p class="authSwitch">Already have an account? <a href="login.html">Login</a></p></div></main>
<script>
async function registerUser(e){e.preventDefault();const nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),msgEl=document.getElementById('msg');msgEl.textContent='Creating account...';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name:String(nameEl?.value||'').trim(),email:String(emailEl?.value||'').trim(),password:String(passwordEl?.value||'')})});const x=await r.json();if(!r.ok)throw Error(x.error);location.href='login.html'}catch(err){msgEl.textContent=err.message}}
</script></body></html>
