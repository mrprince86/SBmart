<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History | SBmart</title><link rel="stylesheet" href="style.css"></head><body><div class="top">SBmart • Order History</div><main class="authPage"><a class="brand" href="index.html"><i>SB</i>mart</a><div class="authCard" style="max-width:800px"><span class="eyebrow">MY ACCOUNT</span><h1>Order History / Track Order</h1><div id="ordersList"><p class="muted">Loading...</p></div><p><a href="index.html">← Back to Store</a></p></div></main><script>async function api(u){const r=await fetch(u);const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){try{const me=await api('/api/customer/me');if(!me.authenticated){location.href='register.html?next=cart';return}const o=await api('/api/customer/orders');ordersList.innerHTML=o.length?o.map(x=>`<div class="orderCard"><b>${esc(x.id)}</b><span>${new Date(x.date).toLocaleString()}</span><p>₹${Number(x.total).toLocaleString('en-IN')} • <strong>${esc(x.status)}</strong></p><small>${x.items.map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</small><p class="muted">Delivery: ${esc(x.customer.address)}</p></div>`).join(''):'<p class="muted">No orders yet.</p>'}catch(e){ordersList.innerHTML='<p>'+esc(e.message)+'</p>'}}load();setInterval(load,5000)</script></body></html>
