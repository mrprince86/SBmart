<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History | SBmart</title><link rel="stylesheet" href="style.css"></head><body><div class="top">SBmart • Order History & Tracking</div><header><a class="brand" href="index.html"><i>SB</i>mart</a><a class="headbtn" href="contact.html">💬 Contact Admin</a></header><main class="pageWrap"><div class="pageTitle"><span class="eyebrow">MY ORDERS</span><h1>Order History & Tracking</h1><p class="muted">Har order ka payment aur delivery status yahan track karein.</p></div><div id="orders" class="orderList"></div></main><script>async function api(u,o={}){const r=await fetch(u,o);const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x}function track(o){const steps=['Pending Verification','Payment Verified','Processing','Shipped','Delivered'];if(o.status==='Rejected')return '<div class="tracking"><div class="trackStep done rejected"><span>!</span><small>Rejected</small></div></div>';let a=Math.max(0,steps.indexOf(o.status));return '<div class="tracking"><div class="trackLine"></div>'+steps.map((x,i)=>`<div class="trackStep ${i<=a?'done':''}"><span>${i<a?'✓':i===a?'●':'○'}</span><small>${x}</small></div>`).join('')+'</div>'}async function load(){const box=document.getElementById('orders');try{const me=await api('/api/customer/me');if(!me.authenticated){location.href='register.html?next=orders';return}const os=await api('/api/customer/orders');box.innerHTML=os.length?os.map(o=>`<article class="orderCard"><div><b>${o.id}</b><span>${new Date(o.date).toLocaleString()}</span></div><p>₹${Number(o.total).toLocaleString('en-IN')} • <strong>${o.status}</strong></p>${track(o)}<small>${o.items.map(i=>`${i.name} × ${i.qty}`).join('<br>')}</small><p class="orderAddress">📍 ${o.customer.address}</p></article>`).join(''):'<div class="emptyCard">No orders yet.</div>'}catch(e){box.innerHTML='<div class="emptyCard">Could not load orders.</div>'}}load()</script></body></html>
