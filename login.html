<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | SBmart</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top">SBmart • Customer Login</div><main class="authPage"><a class="brand" href="index.html"><i>SB</i>mart</a><div class="authCard"><span class="eyebrow">CUSTOMER LOGIN</span><h1>Login</h1><p class="muted">Login before using checkout and payment status.</p>
<form onsubmit="loginUser(event)"><input id="email" required type="email" placeholder="Email address"><input id="password" required type="password" placeholder="Password"><button class="primary wide">Login</button></form><p id="msg" class="authMsg"></p><p class="authSwitch">New customer? <a href="register.html">Create Account</a></p></div></main>
<script>
async function loginUser(e){e.preventDefault();const emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),msgEl=document.getElementById('msg');msgEl.textContent='Logging in...';try{const r=await fetch('/api/customer/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailEl.value.trim(),password:passwordEl.value})});const x=await r.json();if(!r.ok)throw Error(x.error);const next=new URLSearchParams(location.search).get('next');location.href=next==='checkout'?'checkout.html':next==='cart'?'index.html#cart':next==='contact'?'contact.html':'index.html'}catch(err){msgEl.textContent=err.message}}
</script></body></html>
