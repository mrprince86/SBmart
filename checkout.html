<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | SBmart</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top">SBmart • Secure Checkout</div><main class="authPage"><a class="brand" href="index.html"><i>SB</i>mart</a><div class="authCard" style="max-width:760px"><span class="eyebrow">SECURE CHECKOUT</span><h1>Checkout</h1><p class="muted">Delivery address yahin enter karein. Payment ke baad UTR submit karein.</p><div id="summary" class="orderCard"></div><div class="qr"><div id="qrcode"></div></div><p class="muted">UPI ID: <b id="upiId"></b></p><input id="customerName" placeholder="Customer name"><input id="customerMobile" inputmode="numeric" maxlength="10" placeholder="Mobile number"><textarea id="customerAddress" placeholder="Delivery address"></textarea><input id="utr" placeholder="Enter UTR / Transaction ID"><button type="button" class="primary wide" onclick="confirmOrder()">Submit Order for Verification</button><p id="msg" class="authMsg"></p><p><a href="index.html#cart">← Back to Cart</a></p></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const UPI_ID='mrsunnykumar@ptaxis',STORE_NAME='SBmart';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const cart=JSON.parse(localStorage.getItem('sbmart_cart')||'[]');
const total=cart.reduce((s,x)=>s+Number(x.price)*Number(x.qty),0);
async function api(u,o={}){const r=await fetch(u,o);let x={};try{x=await r.json()}catch{}if(!r.ok)throw Error(x.error||'Request failed');return x}
async function init(){if(!cart.length){location.href='index.html#cart';return}try{const me=await api('/api/customer/me');if(!me.authenticated){location.href='register.html?next=checkout';return}customerName.value=me.user.name||'';customerMobile.value=me.user.mobile||'';customerAddress.value=me.user.address||'';upiId.textContent=UPI_ID;summary.innerHTML='<b>Order Total</b><div style="font-size:24px;margin-top:8px">₹'+total.toLocaleString('en-IN')+'</div><small>'+cart.map(x=>esc(x.name)+' × '+x.qty).join('<br>')+'</small>';const uri='upi://pay?pa='+encodeURIComponent(UPI_ID)+'&pn='+encodeURIComponent(STORE_NAME)+'&am='+total.toFixed(2)+'&cu=INR&tn='+encodeURIComponent('SBmart Order');new QRCode(qrcode,{text:uri,width:210,height:210,correctLevel:QRCode.CorrectLevel.M});}catch(e){msg.textContent=e.message}}
async function confirmOrder(){const name=customerName.value.trim(),mobile=customerMobile.value.trim(),address=customerAddress.value.trim(),utr= document.getElementById('utr').value.trim();if(!name||!mobile||!address)return msg.textContent='Name, mobile and delivery address are required';if(!/^\d{10}$/.test(mobile))return msg.textContent='Enter a valid 10-digit mobile number';if(!utr)return msg.textContent='Please enter UTR / Transaction ID';try{const x=await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:{name,mobile,address},items:cart,total,utr})});localStorage.setItem('sbmart_cart','[]');location.href='orders.html?submitted='+encodeURIComponent(x.orderId)}catch(e){msg.textContent=e.message}}
init();
</script></body></html>
