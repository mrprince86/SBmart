<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Service | SBmart</title><link rel="stylesheet" href="style.css"></head><body><div class="top">SBmart • Customer Support</div><header><a class="brand" href="index.html"><i>SB</i>mart</a><a class="headbtn" href="orders.html">📦 My Orders</a></header><main class="pageWrap"><div class="pageTitle"><span class="eyebrow">CUSTOMER SUPPORT</span><h1>Customer Service</h1><p class="muted">Order, payment ya delivery ke baare mein SBmart Admin se directly chat karein.</p></div><div class="chatCard"><div id="chat" class="chatBox"></div><form onsubmit="sendMsg(event)" class="chatForm"><input id="text" required placeholder="Type your message..."><button class="primary">Send</button></form></div></main><script>async function api(u,o={}){const r=await fetch(u,o);const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x}function draw(ms){chat.innerHTML=ms.map(m=>`<div class="msg ${m.from==='customer'?'mine':'theirs'}"><b>${m.from==='customer'?'You':'SBmart Admin'}</b><p>${String(m.text).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</p><small>${new Date(m.date).toLocaleString()}</small></div>`).join('')||'<p class="muted">No messages yet. Start a conversation.</p>';chat.scrollTop=chat.scrollHeight}async function load(){try{const me=await api('/api/customer/me');if(!me.authenticated){location.href='register.html?next=contact';return}draw(await api('/api/customer/messages'));}catch(e){chat.innerHTML='<p>'+e.message+'</p>'}}async function sendMsg(e){e.preventDefault();try{await api('/api/customer/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value.trim()})});text.value='';load()}catch(err){alert(err.message)}}load();setInterval(load,5000)</script></body></html>
