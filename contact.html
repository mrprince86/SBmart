<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Service | SBmart</title><link rel="stylesheet" href="style.css"></head><body><div class="top">SBmart • Customer Service</div><main class="authPage"><a class="brand" href="index.html"><i>SB</i>mart</a><div class="authCard" style="max-width:720px"><span class="eyebrow">CUSTOMER SERVICE</span><h1>Chat with Admin</h1><p class="muted">Order, payment ya delivery ke baare mein SBmart Admin se directly chat karein.</p><div id="chat" class="chatBox"></div><form onsubmit="sendMsg(event)" class="chatForm"><input id="text" required placeholder="Type your message..."><button class="primary wide">Send</button></form><p><a href="index.html">← Back to Store</a></p></div></main><script>async function api(u,o={}){const r=await fetch(u,o);const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function draw(a){chat.innerHTML=a.length?a.map(m=>`<div class="chatMsg"><b>${m.from==='admin'?'Admin':'You'}</b><p>${esc(m.text)}</p><small>${new Date(m.date).toLocaleString()}</small></div>`).join(''):'<p class="muted">No messages yet. Send your first message.</p>';chat.scrollTop=chat.scrollHeight}async function load(){try{const me=await api('/api/customer/me');if(!me.authenticated){location.href='register.html?next=contact';return}draw(await api('/api/customer/messages'))}catch(e){chat.innerHTML='<p>'+esc(e.message)+'</p>'}}async function sendMsg(e){e.preventDefault();try{await api('/api/customer/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value.trim()})});text.value='';load()}catch(e){alert(e.message)}}load();setInterval(load,5000)</script></body></html>
